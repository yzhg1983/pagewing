# Checks and the Chrome suites for pushes to main, pull requests, weekly, and on demand; an installable zip of each main
# build. Other branches get CI through a pull request or a run from the Actions tab. A change to Markdown or docs/ alone
# runs nothing: none of it is linted, tested, or built. Billing rounds each job up to a whole minute, so everything runs
# in one job with one npm ci and one Chrome, except what only Windows can show: Local agents there (design 6.49). The
# suites build their own temporary extensions and use only loopback servers and in-process providers: no secrets,
# accounts, or paid requests (CONTRIBUTING.md, Browser test suites).

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  schedule:
    # Weekly, for drift within the Chrome milestone between pushes; dependency updates come as Dependabot pull requests.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The milestone the suites were last run on; bump it on purpose, not by drift.
  CHROME_VERSION: "153"

jobs:
  ci:
    name: Checks and Chrome suites
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx biome ci .
      - run: npx tsc --noEmit
      - run: npx tsc --noEmit -p mcp
      - run: npm test
      # Also fails on an unreviewed import( in the worker and on a package without a licence.
      - run: npm run build
      - run: npm run build:mcp
      - name: Zip the extension
        if: github.event_name == 'push'
        run: cd dist && zip -qr "../pagewing-${GITHUB_SHA::7}.zip" . -x '*.map'
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: pagewing-${{ github.sha }}
          path: pagewing-*.zip
          retention-days: 30

      # The suites run on the weekly and manual runs, and on a push or pull request that changes what they build or run.
      # When the base commit can't be fetched (a force push), they run.
      - name: Decide whether the Chrome suites run
        id: suites
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = push ] || [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git fetch -q --depth=1 origin "$BASE" 2>/dev/null; then
              changed="$(git diff --name-only "$BASE" HEAD)"
              echo "$changed"
              pattern='^(src/|static/|mcp/|test/e2e/|build\.mjs$|tsconfig\.json$|package(-lock)?\.json$|\.github/workflows/ci\.yml$)'
              if ! grep -qE "$pattern" <<< "$changed"; then
                run=false
                echo "No change the Chrome suites cover: skipping them."
              fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      # The download of the milestone's latest build, kept for a week: the weekly run then picks up a newer one.
      - name: Week for the Chrome cache
        id: week
        if: steps.suites.outputs.run == 'true'
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        if: steps.suites.outputs.run == 'true'
        with:
          path: ${{ runner.tool_cache }}/setup-chrome
          key: chrome-${{ env.CHROME_VERSION }}-${{ steps.week.outputs.week }}
      - id: chrome
        if: steps.suites.outputs.run == 'true'
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: ${{ env.CHROME_VERSION }}
          # The runner image has Chrome's libraries already; installing them only ran apt-get for nothing.
          install-dependencies: false
      - run: '"$CHROME" --version'
        if: steps.suites.outputs.run == 'true'
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
      # Every suite runs even when an earlier one fails, so one run shows all the failures.
      - run: npm run test:selection
        if: ${{ !cancelled() && steps.chrome.outcome == 'success' }}
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run test:localization
        if: ${{ !cancelled() && steps.chrome.outcome == 'success' }}
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run test:screenshots
        if: ${{ !cancelled() && steps.chrome.outcome == 'success' }}
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run test:storage
        if: ${{ !cancelled() && steps.chrome.outcome == 'success' }}
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run test:wake
        if: ${{ !cancelled() && steps.chrome.outcome == 'success' }}
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run test:diagrams
        if: ${{ !cancelled() && steps.chrome.outcome == 'success' }}
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run test:slash
        if: ${{ !cancelled() && steps.chrome.outcome == 'success' }}
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run test:edit
        if: ${{ !cancelled() && steps.chrome.outcome == 'success' }}
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run test:attachments
        if: ${{ !cancelled() && steps.chrome.outcome == 'success' }}
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run test:page-tools
        if: ${{ !cancelled() && steps.chrome.outcome == 'success' }}
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run test:model-list
        if: ${{ !cancelled() && steps.chrome.outcome == 'success' }}
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run test:local-agents
        if: ${{ !cancelled() && steps.chrome.outcome == 'success' }}
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}

  # pagewing-mcp on Windows: its tests, the local agents suite with Chrome starting host.cmd from a folder whose name
  # has a space and Chinese, and the package installed as npm installs it. The runner is a throwaway account: setup
  # writes its registry, and the suite's sentinel listens on its real bridge address.
  windows:
    name: Local agents on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      # cmd.exe reads host.cmd in its console's code page. The console Chrome starts it in gets the system's OEM code page,
      # or HKCU\Console's, not the 65001 of the steps' own shells. On UTF-8 already, the suite would not show that
      # host.cmd's switch works. //v: Git Bash would turn /v into a path.
      - name: Code page of new consoles
        run: |
          reg query 'HKLM\SYSTEM\CurrentControlSet\Control\Nls\CodePage' //v OEMCP | tee pages.txt
          { reg query 'HKCU\Console' //v CodePage 2> /dev/null || true; } | tee -a pages.txt
          if grep -q 65001 pages.txt; then echo "New consoles already use UTF-8."; exit 1; fi
      - run: npx vitest --run mcp/test
      - id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: ${{ env.CHROME_VERSION }}
      - run: npm run test:local-agents
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
      # Without --force, so npm checks the package's "os". A second install finds everything in place; uninstall
      # removes the registry key.
      - name: Install the package and register it
        run: |
          npm run build:mcp
          tmp="$(cygpath -u "$RUNNER_TEMP")"
          npm pack ./mcp --ignore-scripts --pack-destination "$tmp"
          mkdir -p "$(cygpath -u "$LOCALAPPDATA")/Google/Chrome/User Data" "$tmp/pagewing 测试 install"
          cd "$tmp/pagewing 测试 install"
          npm init -y > /dev/null
          npm install --ignore-scripts "$tmp"/pagewing-mcp-*.tgz
          npx pagewing-mcp install | tee first.txt
          grep -q 'Registered: HKCU\\Software\\Google\\Chrome\\NativeMessagingHosts' first.txt
          grep -q 'host.cmd' first.txt
          npx pagewing-mcp install | tee second.txt
          grep -q 'Already registered' second.txt
          npx pagewing-mcp uninstall | tee removed.txt
          grep -q 'Removed: HKCU' removed.txt
